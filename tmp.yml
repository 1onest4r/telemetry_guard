services:
  postgres:
    image: postgres:16
    container_name: telemetry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - pg_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pg_volume:
    driver: local
